<svg viewBox="0 0 1300 480" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4b5563"/>
    </marker>
  </defs>

  <rect width="1300" height="480" fill="#0f172a"/>
  <text x="650" y="40" text-anchor="middle" fill="#f8fafc" font-size="24" font-weight="700">GitHub Trending Data Pipeline — Architecture</text>

  <!-- GitHub API -->
  <g transform="translate(30,110)">
    <rect width="150" height="150" rx="14" fill="#1e293b" stroke="#334155" stroke-width="2"/>
    <circle cx="75" cy="55" r="30" fill="#e2e8f0"/>
    <path d="M75 35 a20 20 0 1 0 0.1 0 M60 60 q15 15 30 0" stroke="#0f172a" stroke-width="3" fill="none"/>
    <text x="75" y="115" text-anchor="middle" fill="#f1f5f9" font-size="14" font-weight="600">GitHub</text>
    <text x="75" y="133" text-anchor="middle" fill="#94a3b8" font-size="12">Search API</text>
  </g>

  <line x1="182" y1="185" x2="228" y2="185" stroke="#4b5563" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Producer -->
  <g transform="translate(230,110)">
    <rect width="150" height="150" rx="14" fill="#1e293b" stroke="#334155" stroke-width="2"/>
    <rect x="35" y="35" width="80" height="55" rx="4" fill="#38bdf8"/>
    <rect x="45" y="45" width="60" height="35" rx="2" fill="#0f172a"/>
    <text x="75" y="67" text-anchor="middle" fill="#38bdf8" font-size="18" font-weight="700">&lt;/&gt;</text>
    <rect x="55" y="90" width="40" height="8" rx="2" fill="#64748b"/>
    <text x="75" y="115" text-anchor="middle" fill="#f1f5f9" font-size="14" font-weight="600">producer.py</text>
    <text x="75" y="133" text-anchor="middle" fill="#94a3b8" font-size="12">Local / Windows</text>
  </g>

  <line x1="382" y1="185" x2="428" y2="185" stroke="#4b5563" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="405" y="175" text-anchor="middle" fill="#64748b" font-size="10">internet</text>

  <!-- EC2 box containing Zookeeper + Kafka -->
  <g transform="translate(430,70)">
    <rect width="340" height="230" rx="14" fill="#132033" stroke="#f59e0b" stroke-width="2" stroke-dasharray="6,4"/>
    <text x="170" y="24" text-anchor="middle" fill="#f59e0b" font-size="13" font-weight="700">AMAZON EC2 INSTANCE</text>

    <!-- Zookeeper -->
    <g transform="translate(20,45)">
      <rect width="140" height="90" rx="10" fill="#1e293b" stroke="#334155" stroke-width="2"/>
      <circle cx="70" cy="35" r="18" fill="#a78bfa"/>
      <rect x="60" y="27" width="20" height="16" fill="#0f172a"/>
      <text x="70" y="68" text-anchor="middle" fill="#f1f5f9" font-size="12" font-weight="600">ZooKeeper</text>
      <text x="70" y="83" text-anchor="middle" fill="#94a3b8" font-size="10">Coordination</text>
    </g>

    <!-- Kafka -->
    <g transform="translate(180,45)">
      <rect width="140" height="90" rx="10" fill="#1e293b" stroke="#334155" stroke-width="2"/>
      <rect x="45" y="20" width="50" height="10" rx="2" fill="#fb7185"/>
      <rect x="45" y="34" width="50" height="10" rx="2" fill="#fb7185"/>
      <rect x="45" y="48" width="50" height="10" rx="2" fill="#fb7185"/>
      <text x="70" y="76" text-anchor="middle" fill="#f1f5f9" font-size="12" font-weight="600">Kafka Broker</text>
      <text x="70" y="90" text-anchor="middle" fill="#94a3b8" font-size="10">Port 9092</text>
    </g>

    <!-- topic -->
    <g transform="translate(90,150)">
      <rect width="160" height="55" rx="8" fill="#0f172a" stroke="#475569" stroke-width="1.5"/>
      <text x="80" y="24" text-anchor="middle" fill="#f1f5f9" font-size="12" font-weight="600">Topic:</text>
      <text x="80" y="42" text-anchor="middle" fill="#38bdf8" font-size="12" font-weight="700">github-trending</text>
    </g>
  </g>

  <line x1="772" y1="185" x2="818" y2="185" stroke="#4b5563" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="795" y="175" text-anchor="middle" fill="#64748b" font-size="10">internet</text>

  <!-- Consumer -->
  <g transform="translate(820,110)">
    <rect width="150" height="150" rx="14" fill="#1e293b" stroke="#334155" stroke-width="2"/>
    <rect x="35" y="35" width="80" height="55" rx="4" fill="#38bdf8"/>
    <rect x="45" y="45" width="60" height="35" rx="2" fill="#0f172a"/>
    <text x="75" y="67" text-anchor="middle" fill="#38bdf8" font-size="18" font-weight="700">&lt;/&gt;</text>
    <rect x="55" y="90" width="40" height="8" rx="2" fill="#64748b"/>
    <text x="75" y="115" text-anchor="middle" fill="#f1f5f9" font-size="14" font-weight="600">consumer.py</text>
    <text x="75" y="133" text-anchor="middle" fill="#94a3b8" font-size="12">Local / Windows</text>
  </g>

  <line x1="972" y1="185" x2="1018" y2="185" stroke="#4b5563" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- S3 -->
  <g transform="translate(1020,110)">
    <rect width="150" height="150" rx="14" fill="#1e293b" stroke="#334155" stroke-width="2"/>
    <path d="M40 45 Q75 30 110 45 L110 85 Q75 100 40 85 Z" fill="#22c55e"/>
    <ellipse cx="75" cy="45" rx="35" ry="12" fill="#4ade80"/>
    <text x="75" y="115" text-anchor="middle" fill="#f1f5f9" font-size="14" font-weight="600">Amazon S3</text>
    <text x="75" y="133" text-anchor="middle" fill="#94a3b8" font-size="12">raw-data/*.json</text>
  </g>

  <!-- vertical connectors down to Glue/Athena row -->
  <line x1="1095" y1="260" x2="1095" y2="330" stroke="#4b5563" stroke-width="2"/>
  <line x1="1095" y1="330" x2="300" y2="330" stroke="#4b5563" stroke-width="2"/>
  <line x1="300" y1="330" x2="300" y2="366" stroke="#4b5563" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Glue -->
  <g transform="translate(220,370)">
    <rect width="160" height="95" rx="14" fill="#1e293b" stroke="#334155" stroke-width="2"/>
    <circle cx="80" cy="35" r="20" fill="none" stroke="#facc15" stroke-width="5"/>
    <circle cx="80" cy="35" r="7" fill="#facc15"/>
    <text x="80" y="68" text-anchor="middle" fill="#f1f5f9" font-size="12" font-weight="600">AWS Glue</text>
    <text x="80" y="84" text-anchor="middle" fill="#94a3b8" font-size="10">Crawler → Catalog</text>
  </g>

  <line x1="382" y1="417" x2="458" y2="417" stroke="#4b5563" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Athena -->
  <g transform="translate(460,370)">
    <rect width="160" height="95" rx="14" fill="#1e293b" stroke="#334155" stroke-width="2"/>
    <circle cx="70" cy="35" r="16" fill="none" stroke="#f472b6" stroke-width="5"/>
    <line x1="82" y1="47" x2="98" y2="63" stroke="#f472b6" stroke-width="6" stroke-linecap="round"/>
    <text x="80" y="68" text-anchor="middle" fill="#f1f5f9" font-size="12" font-weight="600">Amazon Athena</text>
    <text x="80" y="84" text-anchor="middle" fill="#94a3b8" font-size="10">SQL Queries</text>
  </g>

  <line x1="622" y1="417" x2="698" y2="417" stroke="#4b5563" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Results -->
  <g transform="translate(700,370)">
    <rect width="160" height="95" rx="14" fill="#1e293b" stroke="#334155" stroke-width="2"/>
    <rect x="35" y="25" width="90" height="12" rx="2" fill="#4ade80"/>
    <rect x="35" y="42" width="90" height="12" rx="2" fill="#38bdf8"/>
    <rect x="35" y="59" width="60" height="12" rx="2" fill="#fb923c"/>
    <text x="80" y="88" text-anchor="middle" fill="#94a3b8" font-size="10">Insights &amp; Analysis</text>
  </g>

  <text x="650" y="465" text-anchor="middle" fill="#475569" font-size="11">Hourly-scheduled ingestion · Streaming via Kafka · Serverless analytics via Glue + Athena</text>
</svg>
